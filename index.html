<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kare Yakala – Videodan yüksek çözünürlüklü kareler</title>
<style>
:root{
  --bg:#14171c; --panel:#1d2128; --line:#2e343d; --text:#e9ecf1; --muted:#98a1ae;
  --accent:#ffb000; --accent-ink:#1a1300; --err:#ff6b6b;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f3f1ec;--panel:#fff;--line:#dcd8cf;--text:#1b1d21;--muted:#6a6f78;--accent:#c77700;--accent-ink:#fff;--err:#c0392b}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.grow{flex:1 1 280px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
button{padding:10px 18px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.or{color:var(--muted);font-size:.85rem;padding:0 4px 12px}
video{width:100%;max-height:340px;background:#000;border-radius:8px;display:none}
.msg{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--err)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.toolbar{display:none;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frame img{width:100%;display:block;cursor:zoom-in}
.frame div{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:.82rem;color:var(--muted)}
.frame a{color:var(--accent);text-decoration:none;font-weight:600}
.note{font-size:.85rem;color:var(--muted)}
dialog{border:0;background:transparent;max-width:96vw;padding:0}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:96vw;max-height:92vh;display:block;border-radius:6px}
</style>
</head>
<body>
<main>
  <h1>Kare Yakala</h1>
  <p class="sub">Videoyu yükle ya da doğrudan video linkini yapıştır, istediğin aralıkta (milisaniye) tam çözünürlükte kareleri al.</p>

  <section class="panel">
    <div class="row">
      <div class="grow">
        <label for="url">Video linki (doğrudan .mp4 / .webm)</label>
        <input id="url" type="url" placeholder="https://ornek.com/video.mp4">
      </div>
      <button id="loadUrl">Linki yükle</button>
      <span class="or">veya</span>
      <div>
        <label for="file">Bilgisayardan video</label>
        <input id="file" type="file" accept="video/*">
      </div>
    </div>
    <p class="msg" id="loadMsg"></p>
    <video id="video" controls muted playsinline preload="auto"></video>
  </section>

  <section class="panel">
    <div class="grid">
      <div><label for="interval">Aralık (milisaniye)</label><input id="interval" type="number" min="10" step="10" value="100"></div>
      <div><label for="start">Başlangıç (sn)</label><input id="start" type="number" min="0" step="0.01" value="0"></div>
      <div><label for="end">Bitiş (sn)</label><input id="end" type="number" min="0" step="0.01" placeholder="video sonu"></div>
      <div><label for="fmt">Format</label>
        <select id="fmt"><option value="image/png">PNG (kayıpsız)</option><option value="image/jpeg">JPEG (küçük dosya)</option></select></div>
    </div>
    <p class="note" id="estimate">Önce bir video yükle.</p>
    <div class="row" style="margin-top:10px">
      <button id="go" disabled>Kareleri çıkar</button>
      <button id="stop" class="ghost" style="display:none">Durdur</button>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <p class="msg" id="runMsg"></p>
  </section>

  <div class="toolbar" id="toolbar">
    <strong id="count"></strong>
    <button id="zip">Hepsini ZIP indir</button>
  </div>
  <section class="frames" id="frames"></section>
</main>

<dialog id="dlg"><img id="dlgImg" alt="Büyük önizleme"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
let frames = [], running = false, objectUrl = null;

function setMsg(el, text, err){ el.textContent = text; el.classList.toggle('err', !!err); }

function loadSource(src, isBlob){
  frames = []; $('frames').innerHTML = ''; $('toolbar').style.display = 'none';
  $('go').disabled = true;
  video.style.display = 'none';
  if(!isBlob) video.crossOrigin = 'anonymous'; else video.removeAttribute('crossorigin');
  video.src = src;
  video.load();
  setMsg($('loadMsg'), 'Video yükleniyor…');
}

$('loadUrl').onclick = () => {
  const u = $('url').value.trim();
  if(!u) return setMsg($('loadMsg'), 'Önce bir link yapıştır.', true);
  if(/youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|instagram\.com/i.test(u))
    return setMsg($('loadMsg'), 'Bu siteler doğrudan video dosyası vermez. Videoyu indirip "Bilgisayardan video" ile yükle.', true);
  loadSource(u, false);
};

$('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(f);
  loadSource(objectUrl, true);
};

video.onloadedmetadata = () => {
  video.style.display = 'block';
  $('end').value = video.duration.toFixed(2);
  $('go').disabled = false;
  setMsg($('loadMsg'), `Hazır: ${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(2)} sn`);
  updateEstimate();
};
video.onerror = () => setMsg($('loadMsg'),
  'Video yüklenemedi. Link doğrudan bir video dosyası olmalı ve sunucu CORS iznine sahip olmalı. Olmuyorsa dosyayı indirip yükle.', true);

function params(){
  const interval = Math.max(10, +$('interval').value || 100) / 1000;
  const start = Math.max(0, +$('start').value || 0);
  let end = +$('end').value || video.duration;
  end = Math.min(end, video.duration);
  return {interval, start, end, total: Math.max(0, Math.floor((end - start) / interval) + 1)};
}
function updateEstimate(){
  if(!video.duration) return;
  const p = params();
  setMsg($('estimate'), `${p.total} kare çıkarılacak (${video.videoWidth}×${video.videoHeight}).` + (p.total > 500 ? ' Çok kare: tarayıcı belleği zorlanabilir.' : ''));
}
['interval','start','end'].forEach(i => $(i).oninput = updateEstimate);

function seek(t){
  return new Promise(res => {
    const done = () => { video.removeEventListener('seeked', done); res(); };
    video.addEventListener('seeked', done);
    video.currentTime = t;
  });
}
const toBlob = (type) => new Promise(res => canvas.toBlob(res, type, 0.95));

$('go').onclick = async () => {
  if(running) return;
  running = true; frames = []; $('frames').innerHTML = '';
  video.pause();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const p = params(), type = $('fmt').value, ext = type === 'image/png' ? 'png' : 'jpg';
  $('go').disabled = true; $('stop').style.display = ''; $('bar').style.display = 'block';
  setMsg($('runMsg'), '');

  try{
    for(let i = 0; i < p.total && running; i++){
      const t = Math.min(p.start + i * p.interval, video.duration - 0.001);
      await seek(t);
      ctx.drawImage(video, 0, 0);
      const blob = await toBlob(type);
      if(!blob) throw new Error('canvas');
      const ms = Math.round(t * 1000);
      const name = `kare_${String(ms).padStart(8,'0')}ms.${ext}`;
      frames.push({blob, name});
      addCard(blob, name, ms);
      $('barFill').style.width = ((i + 1) / p.total * 100) + '%';
      $('count').textContent = `${frames.length} kare`;
      $('toolbar').style.display = 'flex';
    }
    setMsg($('runMsg'), running ? 'Bitti.' : 'Durduruldu.');
  }catch(e){
    setMsg($('runMsg'), 'Kare alınamadı. Uzak videolarda sunucu CORS izni vermiyorsa bu olur; videoyu indirip dosya olarak yükle.', true);
  }
  running = false; $('go').disabled = false; $('stop').style.display = 'none';
};
$('stop').onclick = () => { running = false; };

function addCard(blob, name, ms){
  const url = URL.createObjectURL(blob);
  const d = document.createElement('div'); d.className = 'frame';
  d.innerHTML = `<img src="${url}" alt="${ms} ms" loading="lazy"><div><span>${(ms/1000).toFixed(3)} sn</span><a href="${url}" download="${name}">İndir</a></div>`;
  d.querySelector('img').onclick = () => { $('dlgImg').src = url; $('dlg').showModal(); };
  $('frames').appendChild(d);
}
$('dlg').onclick = () => $('dlg').close();

$('zip').onclick = async () => {
  if(!frames.length) return;
  if(typeof JSZip === 'undefined') return setMsg($('runMsg'), 'ZIP kütüphanesi yüklenemedi (internet bağlantısını kontrol et).', true);
  $('zip').disabled = true; $('zip').textContent = 'Hazırlanıyor…';
  const z = new JSZip();
  frames.forEach(f => z.file(f.name, f.blob));
  const out = await z.generateAsync({type:'blob', compression:'STORE'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out); a.download = 'kareler.zip'; a.click();
  $('zip').disabled = false; $('zip').textContent = 'Hepsini ZIP indir';
};
</script>
</body>
</html>
